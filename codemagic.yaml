workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      vars:
        JAVA_HOME: $JAVA_HOME_17
    scripts:
      - name: Preparar Estrutura do App (Offline)
        script: |
          # 1. Garante que a pasta 'www' com os arquivos estáticos exista
          mkdir -p www
          cp index.html www/
          cp pdf-lib.min.js www/

      - name: Instalar Dependências Estáveis (Capacitor v6)
        script: |
          # 2. Inicializa o projeto Node
          npm init -y

          # 3. Instala a versão estável e compatível do Capacitor (v6)
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Sincronizar Plataforma Android
        script: |
          # 4. Configura e gera a estrutura nativa Android
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Compilar APK (Debug)
        script: |
          # 5. Dá permissão e compila o APK via Gradle usando Java 17
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
