workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Configurar Projeto e Sincronizar Capacitor
        script: |
          # 1. Cria o package.json se não existir
          npm init -y

          # 2. Instala os pacotes do Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 3. Inicializa e cria a pasta do Android
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "."
          npx cap add android

          # 4. Sincroniza os arquivos e gera os scripts internos (capacitor.settings.gradle)
          npx cap sync android
          
      - name: Compilar APK (Debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
