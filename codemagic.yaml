workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Configurar Projeto e Sincronizar Capacitor
        script: |
          # 1. Cria a pasta da aplicação web exigida pelo Capacitor
          mkdir -p www
          cp index.html www/
          cp pdf-lib.min.js www/

          # 2. Inicializa o projeto Node
          npm init -y

          # 3. Instala os pacotes do Capacitor
          npm install @capacitor/core @capacitor/cli @capacitor/android

          # 4. Inicializa o Capacitor apontando para a pasta 'www'
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "www"
          npx cap add android

          # 5. Sincroniza os arquivos locais com a pasta nativa
          npx cap sync android
          
      - name: Compilar APK (Debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
