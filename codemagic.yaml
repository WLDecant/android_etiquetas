workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 18.x.x
      java: 17
    scripts:
      - name: Instalar dependências e CLI do Capacitor
        script: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          
      - name: Inicializar Capacitor e Plataforma Android
        script: |
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "."
          npx cap add android
          npx cap copy android
          
      - name: Compilar APK (Debug)
        script: |
          cd android
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
