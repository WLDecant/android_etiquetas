workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Preparar Estrutura do App (Offline)
        script: |
          # 1. Cria a pasta 'www' com os arquivos estáticos
          mkdir -p www
          cp index.html www/
          cp pdf-lib.min.js www/

      - name: Instalar Dependências Estáveis (Capacitor v6)
        script: |
          # 2. Inicializa o projeto Node e instala o Capacitor v6
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0

      - name: Sincronizar Plataforma Android
        script: |
          # 3. Configura o Capacitor e gera o projeto nativo
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Compilar APK (Debug)
        script: |
          # 4. Compila o APK via Gradle usando Java 17
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
