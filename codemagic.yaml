workflows:
  android-build:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Criar arquivos nativos do Android com SDK 36
        script: |
          flutter create --platforms=android --org com.wldecant .
          # Injeta configuracao explicita de SDK no build.gradle nativo recem-criado
          python3 -c "
import os, re
path = 'android/app/build.gradle'
if os.path.exists(path):
    with open(path, 'r') as f:
        content = f.read()
    content = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 36', content)
    content = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 36', content)
    with open(path, 'w') as f:
        f.write(content)

path_kts = 'android/app/build.gradle.kts'
if os.path.exists(path_kts):
    with open(path_kts, 'r') as f:
        content = f.read()
    content = re.sub(r'compileSdk\s*=.*', 'compileSdk = 36', content)
    content = re.sub(r'targetSdk\s*=.*', 'targetSdk = 36', content)
    with open(path_kts, 'w') as f:
        f.write(content)
"
      - name: Obter dependencias do Flutter
        script: |
          flutter packages pub get
      - name: Compilar APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - wldecant@gmail.com
