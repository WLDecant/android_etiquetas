workflows:
  android-build:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Criar projeto Android
        script: |
          flutter create --platforms=android --org com.wldecant .

      - name: Atualizar compileSdk
        script: |
          sed -i '' 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i '' 's/targetSdk = flutter.targetSdkVersion/targetSdk = 36/' android/app/build.gradle.kts || true
          sed -i '' 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' android/app/build.gradle || true
          sed -i '' 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 36/' android/app/build.gradle || true

      - name: Pub Get
        script: flutter pub get

      - name: Build
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - wldecant@gmail.com
