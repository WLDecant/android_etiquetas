workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
    scripts:
      - name: Preparar Estrutura do App (Offline)
        script: |
          mkdir -p www
          cp index.html www/
          cp pdf-lib.min.js www/

      - name: Instalar Dependências e Plugins Nativos
        script: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/filesystem@^6.0.0

      - name: Sincronizar Plataforma Android
        script: |
          npx cap init "MescladorPDF" "com.empresa.mesclador" --web-dir "www"
          npx cap add android
          npx cap sync android

      - name: Compilar APK (Debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
