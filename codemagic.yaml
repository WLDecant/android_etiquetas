workflows:
  android-apk-build:
    name: Build Android APK (Offline WebApp)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      java: 17
      node: 18.19.0 # Declarar a versão exata no environment evita o uso do comando 'n'
    scripts:
      - name: Preparar Estrutura do App (Offline)
        script: |
          mkdir -p www
          cp index.html www/
          cp pdf-lib.min.js www/
          # Se usar ícone: cp "Logo sem fundo.png" www/icone.png

      - name: Instalar Dependências e Plugins Nativos
        script: |
          npm init -y
          npm install @capacitor/core@^6.0.0 @capacitor/cli@^6.0.0 @capacitor/android@^6.0.0 @capacitor/filesystem@^6.0.0 @capacitor/share@^6.0.0
          npm install -g @capacitor/assets

      - name: Sincronizar Plataforma Android e Nome do App
        script: |
          npx cap init "Mesclador de Etiquetas - WL Decant" "com.wldecant.mesclador" --web-dir "www"
          
          node -e '
            const fs = require("fs");
            const config = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            config.appName = "Mesclador de Etiquetas - WL Decant";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(config, null, 2));
          '

          npx cap add android
          
          if [ -f "www/icone.png" ]; then
            npx capacitor-assets generate --iconBackgroundColor #ffffff --iconBackgroundColorDark #000000
          fi

          npx cap sync android

      - name: Compilar APK (Debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - android/app/build/outputs/apk/**/*.apk
