workflows:
  android-build:
    name: Compilar APK Android
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Criar projeto Android
        script: |
          flutter create --platforms=android --org com.wldecant .
      - name: Configurar SDK 36 no Gradle
        script: |
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
      - name: Obter dependencias
        script: |
          flutter packages pub get
      - name: Compilar APK
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      email:
        recipients:
          - wldecant@gmail.com
